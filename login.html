<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | StockSense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(36,16,63,.15)}
.box-head{background:var(--side);padding:26px 24px;display:flex;align-items:center;gap:12px}
.box-body{padding:26px 24px}
.box-body h2{font-size:20px;margin-bottom:4px}
.box-body p.sub{color:var(--mu);margin-bottom:20px}
.box-body label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;margin-bottom:14px}
.box-body input{width:100%}
.err{display:none;background:var(--badsoft);color:var(--bad);padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:13px}
.go{width:100%;justify-content:center;padding:11px}
</style>
</head>
<body>
<div class="login">
  <div class="box">
    <div class="box-head">
      <svg class="brand-logo" width="46" height="40" viewBox="0 0 52 46"><g fill="#a78bfa"><path d="M4 21l10-5v24H4z"/><rect x="18" y="3" width="10" height="37" rx="1"/><path d="M32 12l10 4v24H32z"/></g><polyline points="2,42 14,32 25,38 43,15" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 8h11v11z" fill="#facc15"/></svg>
      <div class="brand-text"><strong>Stock <span>Sense</span></strong><small>INVENTORY &amp; FORECAST</small></div>
    </div>
    <div class="box-body">
      <h2>Admin Login</h2>
      <p class="sub">Dashboard khol'ne ke liye login karein</p>
      <div class="err" id="err"></div>
      <label>Username<input id="u" autocomplete="username" autofocus></label>
      <label>Password<input id="p" type="password" autocomplete="current-password"></label>
      <button class="btn bp go" id="go">Login</button>
    </div>
  </div>
</div>

<script>
try {
  const t = localStorage.getItem('ss-theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
} catch (e) {}

const $ = id => document.getElementById(id);
async function login() {
  const err = $('err'); err.style.display = 'none';
  const username = $('u').value.trim(), password = $('p').value;
  if (!username || !password) { err.textContent = 'Username aur password likhein'; err.style.display = 'block'; return; }
  $('go').disabled = true;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || 'Login nahi ho saka');
    location.href = 'dashboard.html';
  } catch (e) {
    err.textContent = e.message; err.style.display = 'block';
  } finally { $('go').disabled = false; }
}
$('go').onclick = login;
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>

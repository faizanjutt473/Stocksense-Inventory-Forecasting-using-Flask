<div class="app">
  <aside class="side" id="side">
    <a href="dashboard.html" class="brand">
      <svg class="brand-logo" width="46" height="40"><use href="#i-logo"/></svg>
      <div class="brand-text"><strong>Stock <span>Sense</span></strong><small>INVENTORY &amp; FORECAST</small></div>

    <nav>
      <p class="nl">Main</p>
      <a href="dashboard.html" class=""><svg class="ic" width="18" height="18"><use href="#i-dash"/></svg>Dashboard</a>
      <a href="products.html" class=""><svg class="ic" width="18" height="18"><use href="#i-bag"/></svg>Products</a>

      <a href="purchase-orders.html" class=""><svg class="ic" width="18" height="18"><use href="#i-file"/></svg>Purchase Orders</a>

    <div class="admin">
      <div class="av"><svg class="ic" width="18" height="18"><use href="#i-admin"/></svg></div>
      <div><b>Admin</b><small>Administrator</small></div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="tl">
        <button class="ib" id="mb" aria-label="Menu"><svg class="ic" width="18" height="18"><use href="#i-menu"/></svg></button>
        <div><h1>Stock In / Out</h1><p>Record stock movements</p></div>
      </div>
      <div class="tr">
        <div class="sw"><svg class="ic" width="18" height="18"><use href="#i-search"/></svg><input id="gs" placeholder="Search products, SKU..."></div>
        <button class="ib" id="tb" aria-label="Theme"></button>
        <button class="ib" id="bell" aria-label="Alerts"><svg class="ic" width="18" height="18"><use href="#i-bell"/></svg></button>
      </div>
    </header>

    <main class="wrap">
      <section class="page show">

<div class="grid g2e">
  <div class="card"><div class="ch"><h3>Record Stock Movement</h3></div>
    <div class="fg">
      <label>Product<select id="mvP"></select></label>
      <label>Type<select id="mvT"><option value="in">Stock In</option><option value="out">Stock Out</option></select></label>
      <label>Quantity<input type="number" id="mvQ" min="1" value="1"></label>
      <label>Note<input id="mvN" placeholder="Optional"></label>
    </div>
    <div class="mf"><button class="btn bp" onclick="movement()">Save Movement</button></div></div>
  <div class="card"><div class="ch"><h3>Movement History</h3></div>
    <div class="tw"><table><thead><tr><th>Date</th><th>Product</th><th>Type</th><th>Qty</th></tr></thead><tbody id="mvH"></tbody></table></div></div>
</div>
      </section>
    </main>
  </div>
</div>


<div class="toast" id="toast"></div>
